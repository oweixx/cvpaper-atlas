name: Deploy CV Paper Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate the published snapshot
        run: |
          python -m unittest discover -s pipeline -p test_cv.py -v
          python pipeline/validate_cv.py
          node --check assets/app.js
          node --check assets/analytics.js
      - name: Assemble the static website
        run: |
          mkdir -p _site/assets _site/data _site/downloads
          cp .nojekyll index.html explorer.html by_year.html coauthor_network.html research_areas.html global_research.html dataset_preview.html _site/
          cp assets/app.js assets/analytics.js assets/style.css _site/assets/
          cp data/{cvpr,iccv,eccv,wacv,tpami,ijcv,summary,geography,world,year_audit,coverage,coverage_affiliations}.json _site/data/
          cp downloads/cvpaper_atlas.{xlsx,csv.gz,jsonl.gz} _site/downloads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
